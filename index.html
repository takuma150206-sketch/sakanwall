<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>左官MR練習 - 平壁（v6.1 道場・Quest専用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
  /* 刃の形状（v6.1）: TROWEL_CFG の寸法から生成。鏝を替えると build() で作り直す */
  AFRAME.registerComponent('blade-shape',{
    init:function(){this.build();},
    build:function(){
      const T=TROWEL_CFG[activeTrowel];
      const hw=T.bladeW/2, TOTAL=T.bladeL, D=T.thick;
      const RECT=(T.tip==='square')?T.bladeL:T.rectL;
      const bot=-TOTAL/2,rTop=bot+RECT,tip=bot+TOTAL;
      const sh=new THREE.Shape();
      if(T.tip==='square'){   /* 木鏝など: 先端が尖らない長方形 */
        sh.moveTo(-hw,bot);sh.lineTo(hw,bot);sh.lineTo(hw,tip);sh.lineTo(-hw,tip);sh.closePath();
      }else{                  /* 剣先: 長方形＋三角の先 */
        sh.moveTo(-hw,bot);sh.lineTo(hw,bot);sh.lineTo(hw,rTop);sh.lineTo(0,tip);sh.lineTo(-hw,rTop);sh.closePath();
      }
      const geo=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:false});
      geo.translate(0,0,-D/2);
      const old=this.el.getObject3D('mesh');
      if(old){try{old.geometry.dispose();old.material.dispose();}catch(e){}}
      this.el.setObject3D('mesh',new THREE.Mesh(geo,
        new THREE.MeshStandardMaterial({color:T.color,metalness:T.metalness,roughness:T.roughness,side:THREE.DoubleSide})));
    }
  });
  /* 鏝板の板本体: 四隅を面取りした八角形（実物写真に準拠） */
  AFRAME.registerComponent('hawk-board',{
    init:function(){
      const S=0.200,CH=0.064,TH=0.008;   /* 半辺200mm(=400mm角), 面取り64mm, 厚み8mm */
      const sh=new THREE.Shape();
      sh.moveTo(-S+CH,-S);sh.lineTo(S-CH,-S);
      sh.lineTo(S,-S+CH);sh.lineTo(S,S-CH);
      sh.lineTo(S-CH,S);sh.lineTo(-S+CH,S);
      sh.lineTo(-S,S-CH);sh.lineTo(-S,-S+CH);
      sh.closePath();
      const geo=new THREE.ExtrudeGeometry(sh,{depth:TH,bevelEnabled:false});
      geo.rotateX(-Math.PI/2);          /* XY平面 → XZ平面（水平な板）に */
      geo.translate(0,TH/2,0);
      this.el.setObject3D('mesh',new THREE.Mesh(geo,
        new THREE.MeshStandardMaterial({color:0xC9A876,roughness:0.85,metalness:0,side:THREE.DoubleSide})));
    }
  });
  AFRAME.registerComponent('trowel',{
    init:function(){
      this.lastTick=0;this.wasContact=false;
      this.heq=null;this.hma=0;this.kgd=false;
      this._lp=new THREE.Vector3();this.spd=0;
      this._wasHadMortar=false;   /* ② mortar-just-ran-out haptic 用 */
      this.rc=new THREE.Raycaster();this.rc.far=0.08;
      /* wrapper -90 X 回転により、wrapper 内の (0, y, -0.042) は rightHand local で (0, -0.042, -y) に。
         Blade rectangular 部分は wrapper local で y=[-0.085, 0.115] → rightHand local で z=[0.085, -0.115]。
         さらに wrapper position="0 0 -0.0175"（柄の中心をコントローラー原点に合わせる）で
         全体が -0.0175 分シフトするので、bpts の Z もその分シフト。*/
      trowelComp=this;
      buildBpts(this);   /* 刃のサンプル点は鏝寸法から導出（v6.1）*/
      this._wp=new THREE.Vector3();this._fwd=new THREE.Vector3();
      this._tp=new THREE.Vector3();this._hp=new THREE.Vector3();this._bc=new THREE.Vector3();
      this._hitN=new THREE.Vector3(0,0,1);   /* ヒット面の法線（曲面/複数面の角度評価用）*/
      this._grabPrev=new THREE.Vector3();this._grabInit=false;   /* 掴み移動用 */
      this.el.addEventListener('abuttondown',()=>{
        const o=this.el.object3D;if(!o)return;
        o.getWorldPosition(this._tp);
        if(diagActive)hideDiag();
        placeWalls(this._tp.x, this._tp.z);
        painters.forEach(p=>resetPainter(p));
        sessionStart=Date.now();kaeshiCount=0;angleGoodTicks=0;angleTotalTicks=0;
        currentStep=0;timerAccum=0;timerStart=performance.now();timerRunning=true;updateTimerBtnLabel();drawStep();
        setMsg('壁を設置');
      });
      /* Ⓑ: 鏝のモルタルを全量、鏝板に戻す */
      this.el.addEventListener('bbuttondown',()=>{
        if(trowelMortar<=0){setMsg('戻す材料がない');return;}
        const back=trowelMortar;
        hawkMortar=Math.min(100,hawkMortar+back);   /* 100 上限で切り捨て */
        trowelMortar=0;
        this.kgd=false;this.heq=null;this.hma=0;
        updMortar();setMsg('鏝板に戻した');haptic(0.45,120);snd.playKG();
      });
      document.getElementById('leftHand').addEventListener('gripdown',()=>{
        hawkMortar=100;updMortar();setMsg('鏝板補充');
      });
      /* 右グリップ: 架台を掴んで移動（v6.1）。左グリップは補充のままなので競合しない */
      this.el.addEventListener('gripdown',()=>{window._grabbing=true;this._grabInit=false;setMsg('架台を掴んだ');haptic(0.4,80);});
      this.el.addEventListener('gripup',()=>{window._grabbing=false;setMsg('架台を固定');haptic(0.3,60);});
    },
    tick:function(){
      const now=performance.now();
      if(now-this.lastTick<16)return;this.lastTick=now;
      window._contactActive=false;   /* ④ 角度指標: 各tick冒頭でリセット、実際に塗る時のみtrue */
      const sc=document.querySelector('a-scene');
      const isXR=sc.is('vr-mode')||sc.is('ar-mode');
      const o=this.el.object3D;if(!o)return;
      const cp=new THREE.Vector3();o.getWorldPosition(cp);
      this.spd=cp.distanceTo(this._lp)*60*100;this._lp.copy(cp);
      if(isXR){try{const s=sc.renderer?.xr?.getSession?.();
        if(s?.inputSources)for(const src of s.inputSources)
          if(src.handedness==='right'&&src.gamepad?.hapticActuators?.length){window._rgp=src.gamepad;break;}
      }catch(e){}}
      /* ★ 架台の掴み移動（v6.1）: 右グリップ中は塗り/コテ返しを止めて平行移動のみ */
      if(window._grabbing){
        const rig=document.getElementById('rig');
        if(rig){
          if(!this._grabInit){this._grabPrev.copy(cp);this._grabInit=true;}
          rig.object3D.position.x+=cp.x-this._grabPrev.x;
          rig.object3D.position.y+=cp.y-this._grabPrev.y;
          rig.object3D.position.z+=cp.z-this._grabPrev.z;
          this._grabPrev.copy(cp);
        }
        if(this.wasContact){snd.stop();this.wasContact=false;}
        window._contactActive=false;lastUV=null;
        return;
      }else{this._grabInit=false;}
      /* コテ返し。wrapper 回転後の blade 中心 (0, 0.015, -0.042) は rightHand で (0, -0.042, -0.015) */
      const lh=document.getElementById('leftHand');
      if(lh?.object3D){
        this._hp.set(0,0.012,-0.05).applyMatrix4(lh.object3D.matrixWorld);
        this._bc.set(0,-0.042,-0.0325).applyMatrix4(o.matrixWorld);
        if(this._bc.distanceTo(this._hp)<0.22){
          if(!this.heq){this.heq=o.quaternion.clone();this.hma=0;if(hawkMortar>0)setMsg('手首をひねれ');}
          this.hma=Math.max(this.hma,o.quaternion.angleTo(this.heq));
          if(this.hma>Math.PI*0.22&&hawkMortar>0){
            const amt=Math.min(TMAX*0.83,hawkMortar);hawkMortar=Math.max(0,hawkMortar-amt);
            trowelMortar=Math.min(TMAX*1.3,trowelMortar+amt);
            this.kgd=true;this.heq=null;this.hma=0;kaeshiCount++;
            updMortar();setMsg('コテ返し');haptic(0.55,150);snd.playKG();
          }
        }else{this.heq=null;this.hma=0;}
      }
      if(!isXR){lastUV=null;this.wasContact=false;return;}
      /* wrapper -90 X 回転後、blade forward (wrapper local -Z) は rightHand local で (0,-1,0) */
      this._fwd.set(0,-1,0).transformDirection(o.matrixWorld);
      const WIDS=['wallMain'];
      let hitEl=null,hitIdx=0;
      for(let i=0;i<WIDS.length;i++){
        const el=document.getElementById(WIDS[i]);if(!el)continue;
        const mesh=el.getObject3D('mesh');if(!mesh)continue;
        this._wp.copy(this.bpts[4]).applyMatrix4(o.matrixWorld);
        this.rc.set(this._wp,this._fwd);
        const ints=this.rc.intersectObject(mesh,true);
        if(ints.length){
          hitEl=el;hitIdx=i;
          if(ints[0].face)this._hitN.copy(ints[0].face.normal).transformDirection(mesh.matrixWorld).normalize();
          else this._hitN.set(0,0,1);
          break;
        }
      }
      if(!hitEl){
        if(this.wasContact)snd.stop();
        lastUV=null;this.wasContact=false;return;
      }
      const wm=hitEl.getObject3D('mesh');
      const uvs=[];
      for(const lp of this.bpts){
        this._wp.copy(lp).applyMatrix4(o.matrixWorld);
        this.rc.set(this._wp,this._fwd);
        const h=this.rc.intersectObject(wm,true);
        if(h.length&&h[0].uv)uvs.push({x:h[0].uv.x,y:h[0].uv.y});
      }
      if(uvs.length<2){lastUV=null;this.wasContact=false;return;}
      /* ③ mode-aware sound + ② rich haptics */
      let mode;
      if(trowelMortar<=0) mode='smooth';
      else if(!this.kgd){
        setMsg('材料を取れ');
        if(this.wasContact){snd.stop();this.wasContact=false;}
        return;
      }
      else mode='paint';
      if(diagActive)hideDiag();   /* 診断表示中に塗り始めたら通常表示に戻す */
      if(!this.wasContact){haptic(0.65,55);snd.start(this.spd,mode);this.wasContact=true;}
      else snd.upd(this.spd,mode);
      const p=painters[hitIdx];
      const spdF=Math.max(0,Math.min(1,this.spd/15));
      /* ④ コテの角度判定: blade の -Z (this._fwd) と壁面法線 (0,0,1) の角度で塗り品質を変化
         10〜25° の範囲で最大品質、平らすぎ／立ちすぎで塗り係数を落とし、触覚も控えめに */
      const tiltCos=Math.max(-1,Math.min(1,-this._fwd.dot(this._hitN)));  /* 曲面/複数面対応: ヒット面法線Nで評価。平面(N=0,0,1)なら従来の -_fwd.z と一致 */
      const tiltDeg=Math.acos(tiltCos)*180/Math.PI;
      const TRC=TROWEL_CFG[activeTrowel];
      /* しなる鏝(仕上鏝)はR壁で曲面に追従するため許容角を広げる */
      const fx=(activeShape==='rwall')?TRC.flex*8:0;
      const AL=TRC.angleLo-fx, AH=TRC.angleHi+fx;
      let angleFactor;
      if(tiltDeg<AL-5)       angleFactor=0.4;   /* 平らすぎて材料が伸びない */
      else if(tiltDeg<AL)    angleFactor=0.7;   /* やや浅い */
      else if(tiltDeg<=AH)   angleFactor=1.0;   /* 適正な塗り角度 */
      else if(tiltDeg<=AH+10)angleFactor=0.7;   /* やや深い */
      else                   angleFactor=0.4;   /* 立ちすぎ、削れる */
      window._angleLo=AL;window._angleHi=AH;
      window._angleDeg=tiltDeg;
      window._angleFactor=angleFactor;
      window._contactActive=true;
      if(mode==='smooth'){
        smoothSurface(p,uvs);
        /* 均し: 乾いた抵抗感、速度で強度が変わる */
        haptic(0.08+spdF*0.15, 20+Math.round((1-spdF)*15));
      }else{
        angleTotalTicks++;if(angleFactor>=0.95)angleGoodTicks++;
        paintSurface(p,uvs,angleFactor);
        /* 塗り: モルタル量と速度で強度・パルス長が変わる。角度適正なら触覚+15%で「気持ちよさ」を明示 */
        const mortarF = 0.12 + 0.25 * (trowelMortar/TMAX);
        haptic(mortarF*(angleFactor>=0.95?1.15:1.0), Math.round(35 - spdF*15));
      }
      /* ② モルタルが今このtickで0になった瞬間の「カリッ」 */
      if(trowelMortar===0 && this._wasHadMortar){
        haptic(0.55, 80);
      }
      this._wasHadMortar = trowelMortar > 0;
      requestHUD();
    }
  });
  </script>
  <style>
    body{margin:0;font-family:-apple-system,sans-serif;}
    #info{position:fixed;top:12px;left:12px;background:rgba(0,0,0,0.65);color:#fff;
      padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.7;z-index:100;max-width:260px;}
    #ver{position:fixed;top:12px;right:12px;background:rgba(0,0,0,0.5);color:#aaa;
      padding:4px 10px;border-radius:6px;font-size:11px;z-index:100;}
    #btn{position:fixed;bottom:24px;right:24px;padding:18px 36px;font-size:18px;
      background:#555;color:#fff;border:none;border-radius:10px;cursor:pointer;z-index:100;font-weight:bold;}
    #btn:hover:not(:disabled){background:#777;}#btn:disabled{background:#444;cursor:not-allowed;}
    #st{position:fixed;bottom:24px;left:24px;background:rgba(0,0,0,0.7);color:#fff;
      padding:8px 12px;border-radius:6px;font-size:12px;z-index:100;}
  </style>
</head>
<body>
  <div id="ver">v6.1 道場</div>
  <div id="info">
    <strong>左官MR練習 - 平壁 (道場)</strong><br>
    塗代ガイド 5mm／最大塗り厚 10mm<br>
    得点基準: 5mm = 100点<br>
    ①艶 ②触覚 ③音 ④角度 ⑤盛り<br>
    記録時に厚み診断（緑=4〜6mm適正 / 黄=薄 / 赤=厚）<br>
    <br>
    Ⓐ 壁を手元に設置<br>
    左グリップ: 鏝板を補充<br>
    鏝板+ひねり → コテ返し<br>
    材料あり → 塗る / なし → 均す
  </div>
  <button id="btn" disabled>確認中...</button>
  <div id="st">確認中...</div>
  <a-scene background="transparent:true" vr-mode-ui="enabled:false"
           webxr="optionalFeatures:hit-test,local-floor,anchors;"
           renderer="colorManagement:true;antialias:true;alpha:true;">
    <a-assets>
      <canvas id="c0" width="512" height="512"></canvas>
      <canvas id="h0" width="128" height="128"></canvas>
      <canvas id="rh0" width="128" height="128"></canvas>
      <canvas id="dg0" width="128" height="128"></canvas>
      <canvas id="opsCvs" width="512" height="512"></canvas>
      <canvas id="hudCvs" width="384" height="560"></canvas>
      <canvas id="histCvs" width="512" height="600"></canvas>
      <canvas id="stepCvs" width="512" height="384"></canvas>
    </a-assets>
    <!-- 架台（v6.1）: 練習対象＋塗代ガイドをまとめて平行移動する親エンティティ。掴み移動/nudgeで動かす -->
    <a-entity id="rig" position="0 0 0">
    <!-- メイン壁: base roughness=1.0, metalness=0.05（湿り感のために metalness を少し盛る） -->
    <a-entity id="wallMain"
      geometry="primitive:plane;width:1.2;height:1.0;segmentsWidth:48;segmentsHeight:40"
      material="shader:standard;roughness:1.0;metalness:0.05;"
      position="0 1.3 -0.70"></a-entity>
    <!-- 2級課題の枠（柱・上枠・土台）。塗り対象ではない -->
    <a-entity id="k2Frame" position="0 1.3 -0.70" visible="false"></a-entity>
    <!-- 塗代ガイド（5mm×5mm 角材, 4辺） -->
    <a-box id="guideT" position="0 1.8025 -0.6975"    width="1.210" height="0.005" depth="0.005" color="#A0825C" material="roughness:0.85;"></a-box>
    <a-box id="guideB" position="0 0.7975 -0.6975"    width="1.210" height="0.005" depth="0.005" color="#A0825C" material="roughness:0.85;"></a-box>
    <a-box id="guideL" position="-0.6025 1.3 -0.6975" width="0.005" height="1.000" depth="0.005" color="#A0825C" material="roughness:0.85;"></a-box>
    <a-box id="guideR" position=" 0.6025 1.3 -0.6975" width="0.005" height="1.000" depth="0.005" color="#A0825C" material="roughness:0.85;"></a-box>
    </a-entity><!-- /rig -->
    <!-- HUD (道場・巻物風) -->
    <a-plane id="hudPanel" width="0.46" height="0.68" position="-1.0 1.84 -0.55" rotation="0 35 0"
             material="shader:flat;color:#fff;"></a-plane>
    <!-- 記録ボタン（藍色） -->
    <a-entity position="-1.0 1.42 -0.55" rotation="0 35 0">
      <a-box id="recBtn" width="0.38" height="0.11" depth="0.04" color="#2a4a6a"></a-box>
      <a-text value="記録する" position="0 0 0.03" align="center" color="#fff" width="1.5"></a-text>
    </a-entity>
    <!-- 履歴を見るボタン（濃緑） -->
    <a-entity position="-1.0 1.29 -0.55" rotation="0 35 0">
      <a-box id="histBtn" width="0.38" height="0.11" depth="0.04" color="#2a5a3a"></a-box>
      <a-text value="履歴を見る" position="0 0 0.03" align="center" color="#fff" width="1.5"></a-text>
    </a-entity>
    <!-- リセットボタン -->
    <a-entity position="-1.0 1.16 -0.55" rotation="0 35 0">
      <a-box id="resetBtn" width="0.38" height="0.11" depth="0.04" color="#a44"></a-box>
      <a-text value="リセット" position="0 0 0.03" align="center" color="#fff" width="1.5"></a-text>
    </a-entity>
    <!-- 手順パネル＋経過タイマー（v6.1 追加） -->
    <a-entity position="0.95 1.02 -0.60" rotation="0 -30 0">
      <a-plane id="stepPanel" width="0.60" height="0.42" material="shader:flat;color:#fff;transparent:true;"></a-plane>
      <a-entity position="-0.20 -0.285 0.02">
        <a-box id="nextBtn" width="0.18" height="0.085" depth="0.03" color="#2a5a3a"></a-box>
        <a-text value="次へ" position="0 0 0.02" align="center" color="#fff" width="1.4"></a-text>
      </a-entity>
      <a-entity position="0 -0.285 0.02">
        <a-box id="timerBtn" width="0.18" height="0.085" depth="0.03" color="#2a4a6a"></a-box>
        <a-text id="timerBtnTxt" value="計測開始" position="0 0 0.02" align="center" color="#fff" width="1.25"></a-text>
      </a-entity>
      <a-entity position="0.20 -0.285 0.02">
        <a-box id="timerResetBtn" width="0.18" height="0.085" depth="0.03" color="#a44"></a-box>
        <a-text value="0に戻す" position="0 0 0.02" align="center" color="#fff" width="1.25"></a-text>
      </a-entity>
    </a-entity>
    <!-- 形状セレクト（v6.1 追加）: レーザーで押す形状切替ボタン -->
    <a-entity position="-1.0 1.00 -0.55" rotation="0 35 0">
      <a-text value="形状切替" position="-0.185 0.078 0.01" align="left" color="#eee" width="1.15"></a-text>
      <a-entity position="-0.128 0 0.01">
        <a-box id="shapePlaneBtn" width="0.115" height="0.09" depth="0.03" color="#c08040"></a-box>
        <a-text value="平壁" position="0 0 0.02" align="center" color="#fff" width="1.0"></a-text>
      </a-entity>
      <a-entity position="0.0 0 0.01">
        <a-box id="shapeRBtn" width="0.115" height="0.09" depth="0.03" color="#555"></a-box>
        <a-text value="R壁" position="0 0 0.02" align="center" color="#fff" width="1.0"></a-text>
      </a-entity>
      <a-entity position="0.128 0 0.01">
        <a-box id="shapeStairBtn" width="0.115" height="0.09" depth="0.03" color="#555"></a-box>
        <a-text value="階段" position="0 0 0.02" align="center" color="#fff" width="1.0"></a-text>
      </a-entity>
      <a-entity position="-0.128 -0.115 0.01">
        <a-box id="shapeK2Btn" width="0.115" height="0.085" depth="0.03" color="#555"></a-box>
        <a-text value="2級課題" position="0 0 0.02" align="center" color="#fff" width="0.85"></a-text>
      </a-entity>
      <a-entity position="0.128 -0.115 0.01">
        <a-box id="shapeRToggleBtn" width="0.115" height="0.085" depth="0.03" color="#3a6a6a"></a-box>
        <a-text id="shapeRToggleTxt" value="凸R" position="0 0 0.02" align="center" color="#fff" width="1.0"></a-text>
      </a-entity>
    </a-entity>
    <!-- 鏝セレクト（v6.1 追加）: レーザーで押す鏝切替ボタン -->
    <a-entity position="-1.0 0.86 -0.55" rotation="0 35 0">
      <a-text value="鏝切替" position="-0.185 0.075 0.01" align="left" color="#eee" width="1.15"></a-text>
      <a-entity position="-0.128 0 0.01">
        <a-box id="trowelBtn0" width="0.115" height="0.085" depth="0.03" color="#c08040"></a-box>
        <a-text value="中塗" position="0 0 0.02" align="center" color="#fff" width="1.0"></a-text>
      </a-entity>
      <a-entity position="0.000 0 0.01">

  <script>
  /* WebXR */
  const stEl=document.getElementById('st'),btnEl=document.getElementById('btn'),sc=document.querySelector('a-scene');
  let arOK=false;
  (async()=>{
    if(!navigator.xr){stEl.textContent='✗ 非対応';return;}

      else stEl.textContent='✗ 非対応';
    }catch(e){stEl.textContent='エラー';}
  })();
  const UI=['btn','st','info','ver'];
  btnEl.addEventListener('click',()=>{snd.init();arOK?sc.enterAR():sc.enterVR();});
  sc.addEventListener('enter-vr',()=>UI.forEach(id=>document.getElementById(id).style.display='none'));

  /* ハプティクス */
  window._rgp=null;

  /* ===== 鏝の種類（v6.1）: 寸法・質感・挙動を一元定義。配列順がボタンの並び順 =====
     bladeW/bladeL/rectL/thick … 刃の実寸(m)。tip:'point'=剣先, 'square'=角(木鏝)
     capacity … 刃に持てる材料量(旧TMAX)  paintGain … 盛りやすさ  smoothGain … 均し/押さえの効き
     wetGain … 艶の出やすさ(木鏝は低い)   angleLo/Hi … 適正な鏝角度(度)
     flex … しなり。R壁で角度許容が広がる sndTone … 塗り音の高さ倍率(木鏝は低く鈍い) */
  const TROWEL_CFG=[
    { id:'nakanuri', name:'中塗鏝', short:'中塗',
      bladeW:0.084, bladeL:0.240, rectL:0.200, thick:0.0025, tip:'point',
      color:0xc4c6ca, metalness:0.90, roughness:0.14,
      capacity:60, paintGain:1.00, smoothGain:1.00, wetGain:1.00,
      angleLo:10, angleHi:25, flex:0.0, sndTone:1.00 },
    { id:'shiage', name:'仕上鏝', short:'仕上',
      bladeW:0.075, bladeL:0.240, rectL:0.205, thick:0.0015, tip:'point',
      color:0xd8dade, metalness:0.96, roughness:0.06,
      capacity:45, paintGain:0.75, smoothGain:1.60, wetGain:1.50,
      angleLo:5,  angleHi:20, flex:0.6, sndTone:1.15 },
    /* 木鏝（v6.1）: 輪郭は中塗鏝と同一（幅84×長240mm・平坦部200mm・剣先）。
       木らしさは厚み8mmと材質・挙動側で出す。tip:'square' の分岐は将来用に残してある */
    { id:'kigote', name:'木鏝', short:'木',
      bladeW:0.084, bladeL:0.240, rectL:0.200, thick:0.008, tip:'point',
      color:0xC9A876, metalness:0.0, roughness:0.85,
      capacity:55, paintGain:1.10, smoothGain:0.80, wetGain:0.25,
      angleLo:10, angleHi:30, flex:0.0, sndTone:0.55 }
  ];
  let activeTrowel=0, trowelComp=null;
  /* 刃のサンプル点を刃寸法から導出（v6.1）。
     従来は 240mm 刃前提の手計算定数(Z0=0.0675/Z1=-0.1325)だった。
     wrapper の -90°X回転で (0,y,z)→(x,z,-y)、さらに wrapper position z=-0.0175 が乗るため
     rightHand local の z = -(0.035 + y_blade) - 0.0175 で求まる。*/
  function buildBpts(comp){
    const T=TROWEL_CFG[activeTrowel];
    const TOTAL=T.bladeL, RECT=(T.tip==='square')?T.bladeL:T.rectL;
    const BOFF_Y=0.035, BOFF_Z=-0.042, WRAP_Z=-0.0175;
    const Z0=-(BOFF_Y-TOTAL/2)+WRAP_Z;
    const Z1=-(BOFF_Y-TOTAL/2+RECT)+WRAP_Z;
    comp.bpts=[];
    for(let i=0;i<9;i++) comp.bpts.push(new THREE.Vector3(0,BOFF_Z,Z0+i/8*(Z1-Z0)));
  }
  /* モルタル状態 */
  let hawkMortar=100,trowelMortar=0,lastUV=null;

  const PCOST=0.35;
  let hudMsg='',msgT=null,bestScore=0;
  /* ===== 経過タイマー（v6.1）: 練習全体の経過時間のみを計測 ===== */
  let timerRunning=false,timerAccum=0,timerStart=0;
  function timerElapsedMs(){return timerAccum+(timerRunning?(performance.now()-timerStart):0);}
  function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  /* ===== 手順（v6.1）: 差し替えやすいよう配列で一元定義 ===== */
  const STEP_LIST=[
    '①壁 左→上→右→下 の順番で縁を塗っていく',
    '②中を真っ直ぐ塗っていく',
    '③全体を押さえる',
    '④完成'
  ];
  let currentStep=0;
  /* ===== 練習対象の形状（v6.1）: 主要パラメータは全てここで一元定義 ===== */
  const SHAPE_CFG={
    plane :{ w:1.2, h:1.0, segW:48, segH:40 },
    /* R壁: 半径R300mm・弧90°（凸/凹は shapeConvex で切替）*/
    rwall :{ radius:0.30, sweepDeg:90, h:1.0, segW:48, segH:40 },
    /* 階段: 踏み面250mm・蹴上げ180mm・幅900mm・3段 */
    stairs:{ tread:0.25, riser:0.18, width:0.90, steps:3, seg:6, widthSeg:30,
             /* 角(稜線)の処理: 稜線を1頂点に溶接し、両面の平均法線で変位させて割れを防ぐ。
                arrisEps を小さくするほど角がシャープに、大きくするほど丸みが出る */
             arrisEps:0.06,
             /* 左右の側板(側面を塞ぐ板)。UVは主面と別領域に確保するので塗り分けできる */
             sidePanels:true, sideSeg:6,
             mainU:0.78, sideU:0.09, gutter:0.02 },
    /* ===== 2級課題（v6.1）: 左官技能士2級 実技課題図(図3.1)を数値化。単位m =====
       正面から見た大壁の開口を定義する。x=左端0→右端0.870、y=土台上端0→上。
       上端輪郭: 左柱際455 →(落ち80)→ 375 →(水平50)→(落ち50)→ 325 →(45°で100下る)→ 225
                 →(水平)→ R200 で立ち上がって右柱際425。R中心は(xa, hRTop)で柱面に接する。
       runTop(455の水平長)だけは図面に寸法が無く、全幅870から逆算した推定値。 */
    k2:{ totalW:0.870, colW:0.100, chiri:0.040,
         hLeft:0.455, hStep:0.375, hSlope:0.325, hMid:0.225, hRTop:0.425,
         R:0.200, runTop:0.050, step50w:0.050, slopeRun:0.100,
         baseH:0.150, frameTop:0.600,
         spacing:0.010, jumpEps:0.0005, gridY:34, chiriSeg:3 }
  };
  let activeShape='plane';
  let shapeConvex=true;   /* R壁: true=凸R / false=凹R */
  /* ===== 架台の移動（v6.1）: 移動/微調整パラメータを一元定義 ===== */
  const MOVE_CFG={
    nudgeStep:0.015,        /* スティック微調整の1刻み (m) ≒1.5cm */
    nudgeThreshold:0.55,    /* スティックの倒し込み判定閾値 */
    nudgeCooldownMs:220     /* 連続nudgeの最短間隔 (ms) */
  };
  window._grabbing=false;   /* 右グリップ押下中=掴み移動モード（塗りは一時停止）*/
  /* ===== 練習履歴の記録用トラッキング ===== */
  const HIST_KEY='sakan_mr_history_v1';
  let sessionStart=Date.now();   /* 現在の練習の開始時刻（記録 or 壁設置でリセット）*/
  let kaeshiCount=0;             /* コテ返し回数 */
  let angleGoodTicks=0,angleTotalTicks=0;  /* 角度が適正だった tick 数 / 塗った総 tick 数 */
  let todayStats={count:0,avg:0,best:0};   /* 本日サマリー（記録時に再計算）*/
  function loadHistory(){
    try{const raw=localStorage.getItem(HIST_KEY);return raw?JSON.parse(raw):[];}
    catch(e){return [];}
  }
  function saveHistory(arr){
    try{localStorage.setItem(HIST_KEY,JSON.stringify(arr));return true;}
    catch(e){return false;}
  }
  function todayKey(d){const t=new Date(d);return `${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`;}
  function recalcToday(){
    const hist=loadHistory();
    const tk=todayKey(Date.now());
    const todays=hist.filter(h=>todayKey(h.t)===tk);
    if(todays.length===0){todayStats={count:0,avg:0,best:0};return;}
    const sum=todays.reduce((a,h)=>a+h.score,0);
    todayStats={
      count:todays.length,
      avg:Math.round(sum/todays.length),
      best:Math.max(...todays.map(h=>h.score))
    };
  }
  function recordSession(){
    const sc=computeScore(painters[0]);
    if(sc.covered===0){setMsg('まだ塗っておらぬ');return;}
    const score=Math.floor(sc.overall*100);
    const rec={
      t:Date.now(),
      score:score,
      rank:getRank(score).name,
      uni:Math.round(sc.uniformity*100),
      thk:Math.round(sc.thickness*100),
      cov:Math.round(sc.coverage*100),
      sec:Math.round((Date.now()-sessionStart)/1000),
      kae:kaeshiCount,
      ang:angleTotalTicks>0?Math.round(angleGoodTicks/angleTotalTicks*100):0
    };
    const hist=loadHistory();
    hist.push(rec);
    if(hist.length>200)hist.splice(0,hist.length-200);  /* 上限 200 件 */
    const ok=saveHistory(hist);
    if(ok){
      recalcToday();
      setMsg(`記録 ${score}点 — 厚みを確認せよ`);
      showDiag(3000);   /* 答え合わせ: 厚み診断を3秒表示 */
      /* 次の練習に向けてカウンタをリセット */
      sessionStart=Date.now();kaeshiCount=0;angleGoodTicks=0;angleTotalTicks=0;
    }else{
      setMsg('記録できませんでした');
    }
    requestHUD();
  }
  function setMsg(m){hudMsg=m;requestHUD();clearTimeout(msgT);msgT=setTimeout(()=>{hudMsg='';requestHUD();},4000);}
  function updMortar(){
    const hv=document.getElementById('hMV');
    if(hv){const r=Math.max(0.02,hawkMortar/100);hv.setAttribute('scale',`${r*0.22} ${r*0.05} ${r*0.22}`);}
    const r=trowelMortar/TMAX;
    /* ⑤ 鏝面のモルタル: 鏝の左側先端-末端に細長い1本の ellipsoid
       radius=0.012 の base sphere が満載時に 幅42mm × 長さ204mm × 盛り高さ28mm の細長カマボコに */
    const rp=Math.pow(r,0.7);
    const opac=(Math.min(1,r*1.1)*0.9).toFixed(2);
    /* v6.1: 満載時に「刃幅の半分 × 長方形部の長さ」を覆うよう、刃寸法から倍率を算出 */
    const T=TROWEL_CFG[activeTrowel];
    const RECTL=(T.tip==='square')?T.bladeL:T.rectL;
    const maxW=(T.bladeW/2)/0.024, maxL=(RECTL*1.02)/0.024;
    const sxW=(0.15+rp*(maxW-0.15)).toFixed(3);  /* 幅 X */
    const syL=(0.30+rp*(maxL-0.30)).toFixed(3);  /* 長さ Y */
    const szD=(0.10+rp*1.05).toFixed(3);         /* 盛り高さ Z */
    const mEl=document.getElementById('tMortar');
    if(mEl){
      mEl.setAttribute('scale',`${sxW} ${syL} ${szD}`);
      mEl.setAttribute('material',`color:#857f78;roughness:0.85;metalness:0;opacity:${opac};transparent:true`);
    }
    requestHUD();
  }
  /* ③ サウンド: 塗り(wet)と均し(dry)の2モード
     paint: 湿った低め「シャー…」、bandpass 中心低め+lowpass 補助
     smooth: 乾いた高め「ザラ…」、bandpass 中心高め+highpass 補助 */
  const snd={ctx:null,nb:null,nd:null,nd2:null,gn:null,fn:null,mode:null,
    init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      const sr=this.ctx.sampleRate,b=this.ctx.createBuffer(1,sr,sr),d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;}catch(e){}},
    /* v5.4 tuning 7: 実物の左官コテ返し動画（youtube 参照）に寄せて、大幅に低域・湿った方向へシフト。
       - 高域ガリガリ寄りだったのを、中低域body重視に転換
       - playbackRate を 1.1-1.5 から 0.95-1.2 に落として粒を少しゆったり戻す
       - HP を大きく下げて body を復活 */
    /* v6.1: 鏝の材質で音の高さを変える（木鏝=低く鈍い / 仕上鏝=硬く高い）*/
    tn(){try{return TROWEL_CFG[activeTrowel].sndTone;}catch(e){return 1;}},
    _paintFreq(spd){return (2000+Math.min(spd,20)*80)*this.tn();},
    _smoothFreq(spd){return (3500+Math.min(spd,20)*130)*this.tn();},
    start(spd,mode){if(!this.ctx||!this.nb)return;this.stop();
      this.mode=mode;
      const isPaint=mode==='paint';
      const now=this.ctx.currentTime;
      /* 主層: HP+LP の帯域通過、湿った body を残す */
      const s=this.ctx.createBufferSource();s.buffer=this.nb;s.loop=true;
      s.playbackRate.value=isPaint?0.95:1.2;
      this.fnHP=this.ctx.createBiquadFilter();this.fnHP.type='highpass';
      this.fnHP.frequency.value=(isPaint?300:600)*this.tn();  /* HP を大きく下げて中低域body復活 */
      this.fn=this.ctx.createBiquadFilter();this.fn.type='lowpass';
      this.fn.frequency.value=isPaint?this._paintFreq(spd):this._smoothFreq(spd);
      /* grit層: 中域 bandpass 低Q + playbackRate ≈1 */
      const s2=this.ctx.createBufferSource();s2.buffer=this.nb;s2.loop=true;
      s2.playbackRate.value=isPaint?0.9:1.1;
      const sec=this.ctx.createBiquadFilter();sec.type='bandpass';
      sec.frequency.value=(isPaint?1200:2500)*this.tn();
      sec.Q.value=3;
      const sg=this.ctx.createGain();sg.gain.value=isPaint?0.08:0.07;
      this.gn=this.ctx.createGain();this.gn.gain.setValueAtTime(0,now);
      this.gn.gain.linearRampToValueAtTime(isPaint?0.14:0.11,now+0.05);
      s.connect(this.fnHP);this.fnHP.connect(this.fn);this.fn.connect(this.gn);
      s2.connect(sec);sec.connect(sg);sg.connect(this.gn);
      this.gn.connect(this.ctx.destination);s.start();s2.start();this.nd=s;this.nd2=s2;},
    upd(spd,mode){if(!this.fn)return;
      if(this.mode!==mode){this.start(spd,mode);return;}
      /* 主層 lowpass 天井を速度で変調 */
      const targetFreq=mode==='paint'?this._paintFreq(spd):this._smoothFreq(spd);
      this.fn.frequency.setTargetAtTime(targetFreq,this.ctx.currentTime,0.05);},
    stop(){if(!this.nd)return;try{this.gn.gain.setTargetAtTime(0,this.ctx.currentTime,0.04);
      const n=this.nd,n2=this.nd2;setTimeout(()=>{try{n.stop();}catch(e){}try{n2?.stop();}catch(e){}},200);}catch(e){}
      this.nd=this.nd2=this.gn=this.fn=this.fnHP=null;this.mode=null;},
    /* v5.4 tuning 7: 全レイヤー同時発火の方式をやめて、時間差で 5 フェーズの物理動作を再現。
       ① 金属接触 → ② 擦り → ③ 湿ったモルタル持ち上げ（低域body復活）→ ④ 湿った中域 → ⑤ スロップ尾音 */
    playKG(){if(!this.ctx||!this.nb)return;
      const now=this.ctx.currentTime;
      const dest=this.ctx.destination;
      /* Phase 1 (0-25ms): 鏝縁が鏝板に当たる金属接触音 - BP 1200Hz Q=3 の重いクリック */
      const s1=this.ctx.createBufferSource();s1.buffer=this.nb;s1.playbackRate.value=1.5;
      const f1=this.ctx.createBiquadFilter();f1.type='bandpass';f1.frequency.value=1200;f1.Q.value=3;
      const g1=this.ctx.createGain();
      g1.gain.setValueAtTime(0.55,now);
      g1.gain.exponentialRampToValueAtTime(0.001,now+0.020);
      s1.connect(f1);f1.connect(g1);g1.connect(dest);
      s1.start(now);s1.stop(now+0.025);
      /* Phase 2 (20-80ms): 引き剥がす金属擦り音 - HP 1500 + LP 5000 の broadband、遅れて立ち上がる */
      const s2=this.ctx.createBufferSource();s2.buffer=this.nb;s2.playbackRate.value=1.3;
      const f2a=this.ctx.createBiquadFilter();f2a.type='highpass';f2a.frequency.value=1500;
      const f2b=this.ctx.createBiquadFilter();f2b.type='lowpass';f2b.frequency.value=5000;
      const g2=this.ctx.createGain();
      g2.gain.setValueAtTime(0,now);
      g2.gain.linearRampToValueAtTime(0.42,now+0.020);
      g2.gain.exponentialRampToValueAtTime(0.001,now+0.075);
      s2.connect(f2a);f2a.connect(f2b);f2b.connect(g2);g2.connect(dest);
      s2.start(now);s2.stop(now+0.080);
      /* Phase 3 (70-180ms): 湿ったモルタルが持ち上がる低域 body - LP 500Hz、後半に膨らむ */
      const s3=this.ctx.createBufferSource();s3.buffer=this.nb;s3.playbackRate.value=0.9;
      const f3=this.ctx.createBiquadFilter();f3.type='lowpass';f3.frequency.value=500;
      const g3=this.ctx.createGain();
      g3.gain.setValueAtTime(0,now);
      g3.gain.linearRampToValueAtTime(0.45,now+0.075);
      g3.gain.exponentialRampToValueAtTime(0.001,now+0.170);
      s3.connect(f3);f3.connect(g3);g3.connect(dest);
      s3.start(now);s3.stop(now+0.180);
      /* Phase 4 (65-155ms): 湿った中域のグルル - BP 700Hz Q=4、playbackRate 0.7 で粗い */
      const s4=this.ctx.createBufferSource();s4.buffer=this.nb;s4.playbackRate.value=0.7;
      const f4=this.ctx.createBiquadFilter();f4.type='bandpass';f4.frequency.value=700;f4.Q.value=4;
      const g4=this.ctx.createGain();
      g4.gain.setValueAtTime(0,now);
      g4.gain.linearRampToValueAtTime(0.30,now+0.070);
      g4.gain.exponentialRampToValueAtTime(0.001,now+0.150);
      s4.connect(f4);f4.connect(g4);g4.connect(dest);
      s4.start(now);s4.stop(now+0.160);
      /* Phase 5 (150-200ms): 尾音のスロップ - LP 300Hz、モルタルが鏝に「ペタッ」と落ちる */
      const s5=this.ctx.createBufferSource();s5.buffer=this.nb;s5.playbackRate.value=0.85;
      const f5=this.ctx.createBiquadFilter();f5.type='lowpass';f5.frequency.value=300;
      const g5=this.ctx.createGain();
      g5.gain.setValueAtTime(0,now);
      g5.gain.linearRampToValueAtTime(0.25,now+0.150);
      g5.gain.exponentialRampToValueAtTime(0.001,now+0.190);
      s5.connect(f5);f5.connect(g5);g5.connect(dest);
      s5.start(now);s5.stop(now+0.200);}
  };
  /* 壁・塗代ガイド配置 */

  /* ペインター */
  const WIDS=['wallMain'];

  function createPainter(cid,hid,rid,did){

  function markDirty(p){if(p.colorTex)p.colorTex.needsUpdate=true;}
  /* ===== 厚み診断（答え合わせ）=====
     未塗装=白 / 4mm未満=黄(薄い) / 4〜6mm=緑(適正) / 6mm超=赤(厚い)
     薄い側・厚い側は外れ具合で濃淡をつける */
  let diagTimer=null,diagActive=false;
  function renderDiag(p){
    const d=p.dgImg.data;
    for(let i=0;i<p.heightData.length;i++){
      const h=p.heightData[i];
      let r,g,b;
      if(h<=0.5){                     /* 未塗装: 白 */
        r=236;g=236;b=232;
      }else if(h<4.0){                /* 薄い: 黄。0.5mm→淡黄, 4mm→濃黄 */
        const t=Math.max(0,Math.min(1,(h-0.5)/3.5));
        r=250;g=Math.round(228-t*40);b=Math.round(130-t*90);
      }else if(h<=6.0){               /* 適正: 緑。中心5mmが最も鮮やか */
        const t=1-Math.abs(h-5.0)/1.0;
        r=Math.round(70-t*30);g=Math.round(180+t*40);b=Math.round(90-t*20);
      }else{                          /* 厚い: 赤。6mm→橙赤, 10mm以上→濃赤 */
        const t=Math.max(0,Math.min(1,(h-6.0)/4.0));
        r=Math.round(228-t*50);g=Math.round(90-t*70);b=Math.round(60-t*40);
      }
      d[i*4]=r;d[i*4+1]=g;d[i*4+2]=b;d[i*4+3]=255;

    if(p.diagTex)p.diagTex.needsUpdate=true;
  }
  function showDiag(ms){
    ms=ms||3000;

  function hideDiag(){
    clearTimeout(diagTimer);

  function renderHt(p){
    const d=p.htImg.data;
    for(let i=0;i<p.heightData.length;i++){
      const v=Math.min(255,Math.floor(Math.max(0,p.heightData[i])/10*255));
      d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;
    }
    p.hc.putImageData(p.htImg,0,0);if(p.heightTex)p.heightTex.needsUpdate=true;
  }
  /* ① 湿り度 → roughness＋metalness テクスチャ更新（v5.4 強化版: レンジ大幅拡大＋metalnessMap 追加）
     緑ch: roughness  (wet=25 → 実効 0.10 でしっかりツヤ、dry=248 → 0.97 でしっかりマット)
     青ch: metalness  (wet=40 → 実効 0.16、dry=5 → 0.02) — わずかな金属感を足して反射を強化 */
  function renderRh(p){
    const d=p.rhImg.data;
    for(let i=0;i<p.wetnessData.length;i++){
      const w=Math.max(0,Math.min(1,p.wetnessData[i]));
      const green=Math.round(25+(1-w)*223);
      const blue =Math.round( 5+w*35);
      d[i*4]=0;d[i*4+1]=green;d[i*4+2]=blue;d[i*4+3]=255;
    }
    p.rhc.putImageData(p.rhImg,0,0);
    if(p.roughnessTex)p.roughnessTex.needsUpdate=true;
  }
  /* 塗り */
  const MR=82,MG=80,MB=75;
  function paintSurface(p,uvs,angleFactor){
    if(uvs.length<2||trowelMortar<=0)return;
    angleFactor=angleFactor||1.0;   /* ④ 角度が適正なら 1.0、外れているほど 0.4 まで下がる */
    const TR=TROWEL_CFG[activeTrowel], bw=TR.bladeW;   /* v6.1: 塗り幅・盛り量は鏝依存 */
    const ctx=p.ctx,W=p.W,H=p.H;
    const pts=uvs.map(u=>({x:u.x*W,y:(1-u.y)*H}));
    const f=pts[0],l=pts[pts.length-1],mid=pts[Math.floor(pts.length/2)],muv=uvs[Math.floor(uvs.length/2)];
    const bdx=l.x-f.x,bdy=l.y-f.y,ba=Math.atan2(bdy,bdx),hl=Math.sqrt(bdx*bdx+bdy*bdy)/2;
    let spd=0;
    if(p.lastUV){const dx=(muv.x-p.lastUV.x)*W,dy=-(muv.y-p.lastUV.y)*H;spd=Math.sqrt(dx*dx+dy*dy);}
    p.lastUV={x:muv.x,y:muv.y};
    const sf=(0.25+Math.random()*0.75)*(1-Math.max(0,Math.min(1,spd/18))*0.55)*angleFactor;
    const sw=26*(bw/0.084)+Math.min(spd*1.2,14);
    const it=Math.min(1,trowelMortar/(TMAX*0.25));
    const cr=Math.round(MR-sf*18),cg=Math.round(MG-sf*16),cb=Math.round(MB-sf*14);
    for(const pt of pts){
      const a=(0.78*it*sf).toFixed(2);
      const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,sw);
      g.addColorStop(0,`rgba(${cr},${cg},${cb},${a})`);
      g.addColorStop(0.65,`rgba(${cr+8},${cg+6},${cb+4},${(a*0.65).toFixed(2)})`);
      g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,sw,0,Math.PI*2);ctx.fill();
    }
    ctx.save();ctx.translate(mid.x,mid.y);ctx.rotate(ba);
    ctx.strokeStyle=`rgba(${MR+25},${MG+22},${MB+20},${(0.45*it*sf).toFixed(2)})`;
    ctx.lineWidth=1.4;
    [-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(-hl*0.92,s*sw*0.82);ctx.lineTo(hl*0.92,s*sw*0.82);ctx.stroke();});
    const num=Math.ceil((sw*2)/7)+1,STEPS=Math.max(20,Math.ceil(hl*2/5));
    for(let i=-Math.floor(num/2);i<=Math.floor(num/2);i++){
      const yo=i*7,ef=1-Math.abs(yo)/(sw*1.1);if(ef<=0)continue;
      const amp=Math.pow(Math.cos(Math.abs(yo)/sw*Math.PI*0.5),0.6)*4.2;
      const al=(0.40*ef*it*sf);
      ctx.strokeStyle=`rgba(${i%2===0?52:178},${i%2===0?49:172},${i%2===0?43:164},${al.toFixed(3)})`;
      ctx.lineWidth=0.7+1.6*Math.pow(ef,0.6);ctx.beginPath();
      for(let s=0;s<=STEPS;s++){
        const x=-hl+s*(hl*2/STEPS),w=Math.sin(x*0.055+i*1.1)*amp+Math.sin(x*0.132+i*0.7)*amp*0.28;
        s===0?ctx.moveTo(x,yo+w):ctx.lineTo(x,yo+w);
      }ctx.stroke();
    }
    ctx.restore();
    for(let i=0;i<30;i++){
      const pt2=pts[Math.floor(Math.random()*pts.length)];
      const gx=pt2.x+(Math.random()-0.5)*sw*2.2,gy=pt2.y+(Math.random()-0.5)*sw*2.2;
      const v=Math.floor(60+Math.random()*40);
      ctx.fillStyle=`rgba(${v},${v-2},${v-4},${((0.28+Math.random()*0.45)*it*sf).toFixed(2)})`;
      ctx.beginPath();ctx.arc(gx,gy,Math.random()*2.5+0.4,0,Math.PI*2);ctx.fill();
    }
    markDirty(p);
    const rH=Math.max(1,Math.round(p.HW*bw/1.2*0.65));
    for(const uv of uvs){
      const cx=Math.floor(uv.x*p.HW),cy=Math.floor((1-uv.y)*p.HH);
      for(let y=Math.max(0,cy-rH);y<Math.min(p.HH,cy+rH+1);y+=2)
        for(let x=Math.max(0,cx-rH);x<Math.min(p.HW,cx+rH+1);x+=2){
          const d=Math.sqrt((x-cx)**2+(y-cy)**2);if(d>rH)continue;
          const ef=d<rH*0.75?1:1-(d-rH*0.75)/(rH*0.25);
          const idx=y*p.HW+x;
          p.heightData[idx]+=ef*sf*0.55*TR.paintGain;
          /* ① 塗った箇所は「濡れ」に上書き（max）*/
          p.wetnessData[idx]=Math.max(p.wetnessData[idx],Math.min(1,ef*0.95*TR.wetGain));
        }
    }
    renderHt(p);
    renderRh(p);
    trowelMortar=Math.max(0,trowelMortar-PCOST);
    if(trowelMortar===0)setMsg('モルタル切れ');
    updMortar();
  }
  /* 均し */
  function smoothSurface(p,uvs){
    if(uvs.length<2)return;
    const TR=TROWEL_CFG[activeTrowel], bw=TR.bladeW;   /* v6.1 */
    const ctx=p.ctx,W=p.W,H=p.H;
    const pts=uvs.map(u=>({x:u.x*W,y:(1-u.y)*H}));
    const f=pts[0],l=pts[pts.length-1],mid=pts[Math.floor(pts.length/2)];
    const bdx=l.x-f.x,bdy=l.y-f.y,ba=Math.atan2(bdy,bdx),hl=Math.sqrt(bdx*bdx+bdy*bdy)/2;
    const sw=36*(bw/0.084);
    const hasPaint=uvs.some(uv=>{
      const cx=Math.floor(uv.x*p.HW),cy=Math.floor((1-uv.y)*p.HH);
      return p.heightData[cy*p.HW+cx]>0.08;
    });
    if(!hasPaint)return;
    for(const pt of pts){
      const px=Math.floor(pt.x/W*p.HW),py=Math.floor(pt.y/H*p.HH);
      if(p.heightData[py*p.HW+px]<0.08)continue;
      const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,sw);
      g.addColorStop(0,'rgba(100,101,98,0.72)');g.addColorStop(0.5,'rgba(95,96,93,0.50)');g.addColorStop(1,'rgba(90,91,88,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,sw,0,Math.PI*2);ctx.fill();
    }
    ctx.save();ctx.translate(mid.x,mid.y);ctx.rotate(ba);
    const sh=ctx.createLinearGradient(-hl*0.8,0,hl*0.8,0);
    sh.addColorStop(0,'rgba(130,131,128,0)');sh.addColorStop(0.5,'rgba(135,136,133,0.25)');sh.addColorStop(1,'rgba(130,131,128,0)');
    ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(0,0,hl*0.8,sw*0.22,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    markDirty(p);
    const rH=Math.max(1,Math.round(p.HW*bw/1.2*0.8));
    let anyWet=false;
    for(const uv of uvs){
      const cx=Math.floor(uv.x*p.HW),cy=Math.floor((1-uv.y)*p.HH);
      for(let y=Math.max(0,cy-rH);y<Math.min(p.HH,cy+rH+1);y+=2)
        for(let x=Math.max(0,cx-rH);x<Math.min(p.HW,cx+rH+1);x+=2){
          const d=Math.sqrt((x-cx)**2+(y-cy)**2);if(d>rH)continue;
          const idx=y*p.HW+x;
          if(p.heightData[idx]<0.08)continue;
          const mn=p.heightData[idx]*0.55;
          p.heightData[idx]=Math.max(mn,p.heightData[idx]-(1-d/rH)*0.12*TR.smoothGain);
          /* 均しは軽く艶を復活（磨いた感） */
          p.wetnessData[idx]=Math.min(1,p.wetnessData[idx]+0.20*TR.wetGain);
          anyWet=true;
        }
    }
    renderHt(p);
    if(anyWet)renderRh(p);
  }
  /* リセット */

  /* ===== 履歴パネルの描画 ===== */
  function drawHistory(){
    const cvs=document.getElementById('histCvs');if(!cvs)return;
    const ctx=cvs.getContext('2d');
    const W=cvs.width,H=cvs.height;

    else if(lowest>=80)    advice='見事な出来 — この調子で精進せよ';
    else                   advice='悪くはない — 更に丁寧に';
    ctx.textAlign='center';ctx.fillStyle='#a02808';
    ctx.font='bold 20px "Yu Mincho","Hiragino Mincho ProN",serif';

  /* ===== スコア計算 ===== */
  function computeScore(p){
    /* TARGET=5: 塗代5mm = 100点。max heightData=10 (10mm) まで盛れるが、5を超えると盛りすぎで減点。 */
    const TARGET=5.0,COV_TH=0.5;
    let covered=0,total=0,sum=0,sumSq=0,sumDev=0;
    for(let i=0;i<p.heightData.length;i+=2){
      total++;
      const h=p.heightData[i];
      if(h>COV_TH){covered++;sum+=h;sumSq+=h*h;sumDev+=Math.abs(h-TARGET);}
    }
    if(covered===0)return{uniformity:0,thickness:0,coverage:0,overall:0,avgH:0,covered:0};
    const avg=sum/covered;
    const variance=sumSq/covered-avg*avg;
    const stddev=Math.sqrt(Math.max(0,variance));
    const avgDev=sumDev/covered;
    const uniformity=Math.max(0,1-stddev/4);
    const thickness=Math.max(0,1-avgDev/5);
    const coverageScore=Math.min(1,covered/total*1.3);
    const overall=uniformity*0.40+thickness*0.35+coverageScore*0.25;
    return{uniformity,thickness,coverage:coverageScore,overall,avgH:avg,covered};
  }

    if(score<15) return{name:'入 門',sub:'まずは塗ってみよ',col:'#7a5a3a'};

    if(score<42) return{name:'三 級',sub:'端まで届かせよ',col:'#6a3a15'};
    if(score<55) return{name:'二 級',sub:'厚みを意識せよ',col:'#5a2a08'};
    if(score<66) return{name:'一 級',sub:'もう一息',col:'#4a1a02'};
    if(score<75) return{name:'初 段',sub:'良き仕上がり',col:'#3a0a00'};
    if(score<83) return{name:'二 段',sub:'平らに仕上ぐ',col:'#2a0500'};
    if(score<90) return{name:'三 段',sub:'目を見張る出来',col:'#220300'};
    if(score<96) return{name:'師 範',sub:'匠の領域',col:'#a02000'};

  /* ===== 形状ジオメトリ生成（v6.1）=====
     いずれも UV を [0,1]^2 に収め、法線を頂点ごとに持たせる。
     → 既存のキャンバス塗り/高さマップ/変位/スコア計算はUV基準なのでそのまま流用できる。 */
  function buildPlaneGeo(){
    const c=SHAPE_CFG.plane;
    return new THREE.PlaneGeometry(c.w,c.h,c.segW,c.segH);   /* UV[0,1], 法線+Z, 原点中心 */
  }
  /* R壁（曲面）: 縦軸まわりに曲げた円筒面の一部。凸/凹で法線と反りを反転 */
  function buildRGeo(){
    const c=SHAPE_CFG.rwall;
    const R=c.radius, sweep=c.sweepDeg*Math.PI/180, H=c.h, segW=c.segW, segH=c.segH;
    const convex=shapeConvex;
    const pos=[],nor=[],uv=[],idx=[];
    for(let j=0;j<=segH;j++){
      const v=j/segH, y=(v-0.5)*H;
      for(let i=0;i<=segW;i++){
        const u=i/segW, a=(u-0.5)*sweep;
        let x,z,nx,nz;
        if(convex){ x=R*Math.sin(a); z=R*Math.cos(a)-R; nx=Math.sin(a); nz=Math.cos(a); }
        else      { x=R*Math.sin(a); z=R-R*Math.cos(a); nx=-Math.sin(a); nz=Math.cos(a); }
        pos.push(x,y,z); nor.push(nx,0,nz); uv.push(u,v);
      }
    }
    for(let j=0;j<segH;j++)for(let i=0;i<segW;i++){
      const a0=j*(segW+1)+i,b0=a0+1,c0=a0+(segW+1),d0=c0+1;
      /* 巻き順を法線(外向き)に合わせる。raycaster の face.normal は巻き順から算出されるため、
         逆だと角度スコアの符号が反転して常に「立ち過ぎ」判定になる */
      idx.push(a0,b0,c0, b0,d0,c0);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    return g;
  }
  /* 階段（v6.1 改訂）: 側面プロファイルを幅方向に押し出す点は従来通りだが、
     ★角(稜線)の割れ対策: 蹴上げと踏み面の境界を「1つの頂点」に溶接し、
       両面の平均法線(miter)を持たせる。従来は境界に法線が90°異なる頂点が二重に存在したため、
       displacementMap で塗り厚を出すと両者が別方向へ押し出されて角に隙間が開いていた。
     ★左右の側板: 階段形の板で側面を塞ぐ。UVは主面と別領域に割り当て、個別に塗れる。 */
  function buildStairsGeo(){
    const c=SHAPE_CFG.stairs;
    const W=c.width, Td=c.tread, Rh=c.riser, N=c.steps, seg=c.seg, wseg=c.widthSeg;
    const EPS=c.arrisEps, MU=c.mainU, SU=c.sideU, GUT=c.gutter, sseg=c.sideSeg;
    /* --- 1) プロファイルを稜線で溶接した1本のポリラインとして構築 --- */
    const segsList=[];
    let y=0,z=0;
    for(let s2=0;s2<N;s2++){
      segsList.push({p0:[z,y], p1:[z,y+Rh], n:[0,0,1]});  y+=Rh;      /* 蹴上げ(垂直) */
      segsList.push({p0:[z,y], p1:[z-Td,y], n:[0,1,0]});  z-=Td;      /* 踏み面(水平) */
    }
    const pts=[];
    function pushPt(pz,py,ny,nz){const L=Math.hypot(ny,nz)||1;pts.push({z:pz,y:py,ny:ny/L,nz:nz/L});}
    for(let i=0;i<segsList.length;i++){
      const sg=segsList[i], nx=segsList[i+1];
      const z0=sg.p0[0],y0=sg.p0[1],z1=sg.p1[0],y1=sg.p1[1];
      if(i===0)pushPt(z0,y0,sg.n[1],sg.n[2]);           /* 始端は面法線のまま */
      const tv=[EPS];
      for(let k=1;k<seg;k++){const t=k/seg;if(t>EPS&&t<1-EPS)tv.push(t);}
      tv.push(1-EPS);
      tv.forEach(t=>pushPt(z0+(z1-z0)*t, y0+(y1-y0)*t, sg.n[1], sg.n[2]));
      /* 終端=稜線。次面との平均法線を持つ「1頂点」を共有 → 変位しても割れない */
      if(nx)pushPt(z1,y1, sg.n[1]+nx.n[1], sg.n[2]+nx.n[2]);
      else  pushPt(z1,y1, sg.n[1], sg.n[2]);
    }
    let total=0;const cum=[0];
    for(let i=1;i<pts.length;i++){total+=Math.hypot(pts[i].z-pts[i-1].z,pts[i].y-pts[i-1].y);cum.push(total);}
    /* --- 2) 主面(踏み面+蹴上げ)のストリップ: u=幅[0,MU], v=プロファイル長 --- */
    const pos=[],nor=[],uv=[],idx=[];
    const rows=[];
    for(let i=0;i<pts.length;i++){
      const P=pts[i], v=cum[i]/total, rs=pos.length/3;
      for(let b=0;b<=wseg;b++){
        const t=b/wseg;
        pos.push((t-0.5)*W, P.y, P.z);
        nor.push(0,P.ny,P.nz);
        uv.push(t*MU, v);
      }
      rows.push(rs);
    }
    for(let i=0;i<pts.length-1;i++)for(let b=0;b<wseg;b++){
      const r0=rows[i]+b,r1=rows[i]+b+1,r2=rows[i+1]+b,r3=rows[i+1]+b+1;
      idx.push(r0,r1,r2, r1,r3,r2);
    }
    /* --- 3) 左右の側板: 段ごとの矩形を並べて階段形の板にする --- */
    if(c.sidePanels){
      const zSpan=N*Td, ySpan=N*Rh;
      [-1,1].forEach((sign,si)=>{
        const x=sign*W/2;
        const u0=(si===0)?(MU+GUT):(MU+GUT+SU+GUT);
        for(let st=0;st<N;st++){
          const za=-(st+1)*Td, zb=-st*Td, yb=(st+1)*Rh;
          const rws=[];
          for(let a=0;a<=sseg;a++){
            const yy=(a/sseg)*yb, rs=pos.length/3;
            for(let b=0;b<=sseg;b++){
              const zz=za+(zb-za)*(b/sseg);
              pos.push(x,yy,zz); nor.push(sign,0,0);
              uv.push(u0+SU*((zz+zSpan)/zSpan), yy/ySpan);
            }
            rws.push(rs);
          }
          for(let a=0;a<sseg;a++)for(let b=0;b<sseg;b++){
            const r0=rws[a]+b,r1=rws[a]+b+1,r2=rws[a+1]+b,r3=rws[a+1]+b+1;
            /* 側板の巻き順: 外向き(±X)になる向きに揃える。
               raycaster の face.normal は巻き順から算出されるため、これが逆だと角度判定の符号が反転する */
            if(sign>0)idx.push(r0,r2,r1, r1,r2,r3);
            else      idx.push(r0,r1,r2, r1,r3,r2);
          }
        }
      });
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    g.center();   /* 練習しやすい高さに置けるよう原点中心へ */
    return g;
  }
  /* ===== 2級課題（v6.1）: 寸法の導出と上端輪郭 ===== */
  function k2Dims(){
    const c=SHAPE_CFG.k2, E=c.jumpEps;
    const xL=c.colW, xR=c.totalW-c.colW;
    const x1 =xL+c.runTop;      /* 455 の水平の終わり */
    const x1e=x1+E;             /* 80 落ちた直後 = 375 の水平の始まり */
    const x2 =x1e+c.step50w;    /* 375 の水平(50)の終わり */
    const x2e=x2+E;             /* 50 落ちた直後 = 45° の始まり(325) */
    const x3 =x2e+c.slopeRun;   /* 45°(水平100)の終わり = 225 */
    const xa =xR-c.R;           /* R の起点。R中心(xa,hRTop)なので柱面に接する */
    return {c,E,xL,xR,x1,x1e,x2,x2e,x3,xa};
  }
  /* 大壁上端の高さ yTop(x)。段の落ち込みは jumpEps 幅の急斜面として表現（真の垂直の近似）。
     落ち量80/50、水平50、45°の水平100 はいずれも図面どおり厳密になるよう区間を割り当てている。 */
  function k2YTop(x){
    const d=k2Dims(), c=d.c;
    if(x<=d.x1)  return c.hLeft;
    if(x<=d.x1e) return c.hLeft +(c.hStep -c.hLeft )*(x-d.x1)/d.E;  /* 80 の落ち込み */
    if(x<=d.x2)  return c.hStep;
    if(x<=d.x2e) return c.hStep +(c.hSlope-c.hStep )*(x-d.x2)/d.E;  /* 50 の落ち込み */
    if(x<=d.x3)  return c.hSlope-(x-d.x2e);                         /* 45°: 1:1 で下る */
    if(x<=d.xa)  return c.hMid;
    const t=x-d.xa;
    return c.hRTop-Math.sqrt(Math.max(0,c.R*c.R-t*t));   /* R200 */
  }
  /* 大壁のx標本列。折れ点と段の落ち込みを必ず含める */
  function k2Xs(){
    const d=k2Dims(), c=d.c, E=c.jumpEps, SP=c.spacing, xs=[];
    const add=(a,b)=>{const N=Math.max(1,Math.round((b-a)/SP));
      for(let k=0;k<=N;k++){const v=a+(b-a)*k/N;if(!xs.length||v>xs[xs.length-1]+1e-9)xs.push(v);}};
    add(d.xL,d.x1); add(d.x1,d.x1e); add(d.x1e,d.x2); add(d.x2,d.x2e);
    add(d.x2e,d.x3); add(d.x3,d.xa); add(d.xa,d.xR);
    return xs;
  }
  /* 塗り面＝大壁。輪郭に沿ってグリッドを張るので、被覆率も開口の実面積で評価される */
  function buildK2Wall(){
    const d=k2Dims(), c=d.c;
    const xs=k2Xs(), NY=c.gridY;
    const tx=-c.totalW/2, ty=-c.hLeft/2;
    const pos=[],nor=[],uv=[],idx=[],rows=[];
    for(let i=0;i<xs.length;i++){
      const x=xs[i], yt=k2YTop(x), rs=pos.length/3;
      for(let j=0;j<=NY;j++){
        const y=yt*j/NY;
        pos.push(x+tx, y+ty, 0);
        nor.push(0,0,1);
        uv.push((x-d.xL)/(d.xR-d.xL), y/c.hLeft);   /* 実寸に比例したUV */
      }
      rows.push(rs);
    }
    for(let i=0;i<xs.length-1;i++)for(let j=0;j<NY;j++){
      const r0=rows[i]+j,r1=rows[i]+j+1,r2=rows[i+1]+j,r3=rows[i+1]+j+1;
      idx.push(r0,r2,r1, r1,r2,r3);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    return g;
  }
  /* 枠（柱・上枠・土台）＝見付け面 + ちり面。塗り対象ではなく見た目と基準用 */
  function buildK2Frame(){
    const d=k2Dims(), c=d.c, Z=c.chiri;
    const tx=-c.totalW/2, ty=-c.hLeft/2;
    const pos=[],nor=[],uv=[],idx=[];
    const V=(x,y,z,n)=>{pos.push(x+tx,y+ty,z);nor.push(n[0],n[1],n[2]);uv.push(0,0);return pos.length/3-1;};
    const quad=(a,b,cc,dd)=>{idx.push(a,b,cc, a,cc,dd);};
    /* --- 見付け面(z=chiri, 法線+Z): 左柱 / 右柱 / 上枠 / 土台 --- */
    const N=[0,0,1];
    const flat=(x0,x1,y0,y1)=>{quad(V(x0,y0,Z,N),V(x1,y0,Z,N),V(x1,y1,Z,N),V(x0,y1,Z,N));};
    flat(0,d.xL,-c.baseH,c.frameTop);            /* 左柱 */
    flat(d.xR,c.totalW,-c.baseH,c.frameTop);     /* 右柱 */
    flat(d.xL,d.xR,-c.baseH,0);                  /* 土台 */
    const xs=k2Xs();                             /* 上枠(輪郭より上) */
    for(let i=0;i<xs.length-1;i++){
      const xa2=xs[i],xb=xs[i+1],ya=k2YTop(xa2),yb=k2YTop(xb);
      quad(V(xa2,ya,Z,N),V(xb,yb,Z,N),V(xb,c.frameTop,Z,N),V(xa2,c.frameTop,Z,N));
    }
    /* --- ちり面(z=0→chiri): 開口の周囲。法線は開口側を向く --- */
    const strip=(x0,y0,x1,y1)=>{
      const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); if(L<1e-9)return;
      const n=[dy/L,-dx/L,0];                    /* 進行方向を-90°回すと開口側 */
      quad(V(x0,y0,0,n),V(x1,y1,0,n),V(x1,y1,Z,n),V(x0,y0,Z,n));
    };
    for(let i=0;i<xs.length-1;i++) strip(xs[i],k2YTop(xs[i]),xs[i+1],k2YTop(xs[i+1]));   /* 上端輪郭 */
    strip(d.xL,0,d.xL,c.hLeft);                  /* 左柱のちり */
    strip(d.xR,c.hRTop,d.xR,0);                  /* 右柱のちり */
    strip(d.xR,0,d.xL,0);                        /* 土台のちり */
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    return g;
  }
  /* 現在アクティブなメッシュのジオメトリと塗り面を差し替える */
  function applyShape(key){
    activeShape=key;
    const el=document.getElementById('wallMain');if(!el)return;
    const mesh=el.getObject3D('mesh');if(!mesh)return;
    let geo;
    if(key==='rwall')geo=buildRGeo();
    else if(key==='stairs')geo=buildStairsGeo();
    else if(key==='k2')geo=buildK2Wall();
    else geo=buildPlaneGeo();
    const old=mesh.geometry;
    mesh.geometry=geo;
    if(old&&old!==geo)old.dispose();
    mesh.material.side=THREE.DoubleSide;   /* 曲面/複数面でも裏面カリングで消えないように */
    mesh.material.needsUpdate=true;
    /* 2級課題のときだけ枠(柱/上枠/土台)を出す */
    const fr=document.getElementById('k2Frame');
    if(fr){
      if(key==='k2'){
        const om=fr.getObject3D('mesh');
        if(om){try{om.geometry.dispose();om.material.dispose();}catch(e){}}
        fr.setObject3D('mesh',new THREE.Mesh(buildK2Frame(),
          new THREE.MeshStandardMaterial({color:0xC9A876,roughness:0.85,metalness:0,side:THREE.DoubleSide})));
      }
      fr.setAttribute('visible',key==='k2');
    }
    const showGuide=(key==='plane');
    ['guideT','guideB','guideL','guideR'].forEach(id=>{const gg=document.getElementById(id);if(gg)gg.setAttribute('visible',showGuide);});
    painters.forEach(p=>resetPainter(p));   /* 新形状で塗りをやり直し */
    sessionStart=Date.now();kaeshiCount=0;angleGoodTicks=0;angleTotalTicks=0;
    updateShapeButtons();
    const nm={plane:'平壁',rwall:(shapeConvex?'凸R壁':'凹R壁'),stairs:'階段',k2:'2級課題'};
    setMsg('形状: '+nm[key]);
  }
  function updateShapeButtons(){
    const map={plane:'shapePlaneBtn',rwall:'shapeRBtn',stairs:'shapeStairBtn',k2:'shapeK2Btn'};
    Object.keys(map).forEach(k=>{const b=document.getElementById(map[k]);if(b)b.setAttribute('color',k===activeShape?'#c08040':'#555');});
    const t=document.getElementById('shapeRToggleTxt');if(t)t.setAttribute('value',shapeConvex?'凸R':'凹R');
  }
  document.getElementById('shapePlaneBtn').addEventListener('click',()=>{applyShape('plane');haptic(0.3,60);});
  document.getElementById('shapeRBtn').addEventListener('click',()=>{applyShape('rwall');haptic(0.3,60);});
  document.getElementById('shapeStairBtn').addEventListener('click',()=>{applyShape('stairs');haptic(0.3,60);});
  document.getElementById('shapeK2Btn').addEventListener('click',()=>{applyShape('k2');haptic(0.3,60);});
  document.getElementById('shapeRToggleBtn').addEventListener('click',()=>{
    shapeConvex=!shapeConvex;
    if(activeShape==='rwall')applyShape('rwall');
    else{updateShapeButtons();setMsg('R壁: '+(shapeConvex?'凸':'凹'));}
    haptic(0.3,60);
  });
  /* ===== 架台の移動 操作（v6.1）: スティックによる微調整nudge ===== */
  function nudgeRig(axis,d){
    const r=document.getElementById('rig');if(!r)return;
    r.object3D.position[axis]+=d;
    const jp={x:'左右',y:'上下',z:'前後'}[axis];
    setMsg('架台 '+jp+' '+(d>0?'+':'-')+Math.round(Math.abs(d)*100)+'cm');
    haptic(0.2,40);
  }
  let _lastNudge=0;
  function onStick(src,e){
    const now=performance.now();if(now-_lastNudge<MOVE_CFG.nudgeCooldownMs)return;
    const x=(e.detail&&e.detail.x)||0,y=(e.detail&&e.detail.y)||0;
    const T=MOVE_CFG.nudgeThreshold,S=MOVE_CFG.nudgeStep;
    let acted=false;
    if(src==='left'){
      /* 左スティック: 水平面。左右=X, 前後=Z（上に倒す=奥=-Z）*/
      if(Math.abs(x)>=Math.abs(y)){ if(Math.abs(x)>T){nudgeRig('x',Math.sign(x)*S);acted=true;} }
      else { if(Math.abs(y)>T){nudgeRig('z',Math.sign(y)*S);acted=true;} }
    }else{
      /* 右スティック: 上下=Y（上に倒す=上げる=+Y）*/
      if(Math.abs(y)>T){nudgeRig('y',-Math.sign(y)*S);acted=true;}
    }
    if(acted)_lastNudge=now;
  }
  { const L=document.getElementById('leftHand'),R=document.getElementById('rightHand');
    if(L)L.addEventListener('thumbstickmoved',e=>onStick('left',e));
    if(R)R.addEventListener('thumbstickmoved',e=>onStick('right',e)); }
  /* ===== 鏝の切り替え（v6.1）===== */
  function applyTrowel(i){
    activeTrowel=i;
    const T=TROWEL_CFG[i];
    TMAX=T.capacity;
    if(trowelMortar>TMAX*1.3)trowelMortar=TMAX*1.3;   /* 容量の小さい鏝へ移った時の溢れを抑える */
    const bl=document.querySelector('[blade-shape]');
    if(bl&&bl.components&&bl.components['blade-shape'])bl.components['blade-shape'].build();
    if(trowelComp)buildBpts(trowelComp);              /* 塗り判定のサンプル点を新寸法で再導出 */
    /* 鏝面のモルタル表示位置も刃寸法に合わせる */
    const RECTL=(T.tip==='square')?T.bladeL:T.rectL;
    const mEl=document.getElementById('tMortar');
    if(mEl)mEl.setAttribute('position',{x:-T.bladeW/4, y:0.035+(-T.bladeL/2+RECTL/2), z:-0.057});
    updateTrowelButtons();updMortar();drawHUD();
    setMsg('鏝: '+T.name);
  }
  function updateTrowelButtons(){
    TROWEL_CFG.forEach((t,i)=>{
      const b=document.getElementById('trowelBtn'+i);
      if(b)b.setAttribute('color',i===activeTrowel?'#c08040':'#555');
    });
  }
  TROWEL_CFG.forEach((t,i)=>{
    const b=document.getElementById('trowelBtn'+i);
    if(b)b.addEventListener('click',()=>{applyTrowel(i);haptic(0.3,60);});
  });
  updMortar();
  </script>
